<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Level Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', 'Courier New', monospace;
            background: linear-gradient(180deg, #000 0%, #1a0a2e 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden; /* prevent page scroll; use inner scrollers */
        }

        .container {
            max-width: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            align-items: center;
            padding: 25px 0 0 0;
            min-width: 0;
        }

        .side-panel-header {
            cursor: pointer;
            padding: 8px 4px;
            background: rgba(139, 92, 246, 0.2);
            border-bottom: 2px solid #8b5cf6;
            user-select: none;
            text-align: center;
            margin-bottom: 8px;
            transition: background 0.2s ease, margin-bottom 0.3s ease, padding 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .side-panel.minimized .side-panel-header {
            margin: 0;
            padding: 0;
            height: 100%;
            border-bottom: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .side-panel-header:hover {
            background: rgba(139, 92, 246, 0.4);
        }

        .side-panel-header:active {
            background: rgba(139, 92, 246, 0.5);
        }

        .side-panel-header h1 {
            font-size: 16px;
            margin: 0;
            pointer-events: none;
        }

        .size-panel .side-panel-header {
            border-bottom: none;
        }

        .size-panel.minimized .side-panel-header {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            border-bottom: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .size-panel.minimized .side-panel-header h1 {
            font-size: 16px;
            margin: 0;
            padding: 0;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toolbar-btn {
            width: 48px;
            height: 48px;
            margin: 4px auto;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%);
            border: 3px solid #8b5cf6;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .toolbar-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.5);
            background: linear-gradient(180deg, #a78bfa 0%, #8b5cf6 100%);
        }

        .toolbar-btn:active {
            transform: translateY(0);
        }

        .toolbar-btn.danger {
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
            border: 3px solid #8b5cf6;
        }

        .toolbar-btn.success {
            background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
            border: 3px solid #8b5cf6;
        }

        .toolbar-btn.warning {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            border: 3px solid #8b5cf6;
        }

        .toolbar-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toolbar-btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .toolbar-separator {
            height: 2px;
            background: #8b5cf6;
            margin: 8px 4px;
            border-radius: 1px;
        }

        .toolbar-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 4px;
        }

        .toolbar-input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 4px 0;
            padding: 4px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .toolbar-input-group input {
            width: 100%;
            padding: 6px;
            border: 1px solid #8b5cf6;
            border-radius: 3px;
            background: #0a0a1a;
            color: #fff;
            font-size: 14px;
            text-align: center;
        }

        /* Hide number input spinners */
        .toolbar-input-group input[type="number"]::-webkit-inner-spin-button,
        .toolbar-input-group input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .toolbar-input-group input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .toolbar-input-group label {
            font-size: 9px;
            color: #a78bfa;
            text-align: center;
        }

        h1 {
            text-align: center;
            color: #ffcc00;
            text-shadow: 2px 2px 0 #d35400, 3px 3px 0 #000;
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
        }

        .side-panel {
            position: fixed;
            left: 20px;
            top: 20px;
            background: linear-gradient(180deg, #2c1654 0%, #1a0a2e 100%);
            border: 3px solid #8b5cf6;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), 0 8px 32px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            transition: width 0.3s ease-in-out, height 0.3s ease-in-out, min-width 0.3s ease-in-out, min-height 0.3s ease-in-out, max-width 0.3s ease-in-out, max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
            width: 60px;
            min-width: 60px;
            max-width: 60px;
            min-height: 60px;
            max-height: calc(100vh - 40px);
            padding: 0;
            overflow: hidden;
        }

        .side-panel.expanded {
            width: 60px;
            min-width: 60px;
            max-width: 60px;
            height: auto;
            min-height: auto;
            max-height: calc(100vh - 40px);
            padding: 8px 4px;
        }

        .side-panel.minimized {
            width: 60px;
            min-width: 60px;
            max-width: 60px;
            height: 60px;
            min-height: 60px;
            max-height: 60px;
            padding: 0;
        }

        .side-panel-content {
            transition: opacity 0.3s ease-in-out, max-height 0.3s ease-in-out, padding 0.3s ease-in-out, margin 0.3s ease-in-out;
            opacity: 1;
            max-height: 2000px;
            overflow: hidden;
        }

        .side-panel.minimized .side-panel-content {
            opacity: 0;
            max-height: 0;
            padding: 0;
            margin: 0;
        }

        .side-panel .toolbar-separator,
        .side-panel .toolbar-group {
            transition: opacity 0.3s ease-in-out, max-height 0.3s ease-in-out, margin 0.3s ease-in-out, padding 0.3s ease-in-out, transform 0.3s ease-in-out;
            opacity: 1;
            max-height: 500px;
            overflow: hidden;
        }

        .side-panel.minimized .toolbar-separator,
        .side-panel.minimized .toolbar-group {
            opacity: 0;
            max-height: 0;
            margin: 0;
            padding: 0;
            transform: translateY(-10px);
        }

        .size-panel {
            position: fixed;
            left: 100px;
            top: 20px;
            background: linear-gradient(180deg, #2c1654 0%, #1a0a2e 100%);
            border: 3px solid #8b5cf6;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), 0 8px 32px rgba(0, 0, 0, 0.8);
            z-index: 1000;
            transition: width 0.3s ease, height 0.3s ease, min-width 0.3s ease, min-height 0.3s ease, max-width 0.3s ease, max-height 0.3s ease, padding 0.3s ease;
            width: 60px;
            min-width: 60px;
            max-width: 60px;
            min-height: 60px;
            max-height: calc(100vh - 40px);
            padding: 0;
            overflow: hidden;
        }

        .size-panel.expanded {
            width: 120px;
            min-width: 120px;
            max-width: 120px;
            height: auto;
            min-height: auto;
            max-height: calc(100vh - 40px);
            padding: 8px 4px;
        }

        .size-panel.minimized {
            width: 60px;
            min-width: 60px;
            max-width: 60px;
            height: 60px;
            min-height: 60px;
            max-height: 60px;
            padding: 0;
        }

        .size-panel-content {
            transition: opacity 0.3s ease, max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
            opacity: 1;
            max-height: 2000px;
            overflow: hidden;
        }

        .size-panel.minimized .size-panel-content {
            opacity: 0;
            max-height: 0;
            padding: 0;
            margin: 0;
        }

        .size-panel .toolbar-group,
        .size-panel .toolbar-input-group {
            transition: opacity 0.3s ease, max-height 0.3s ease, margin 0.3s ease, padding 0.3s ease;
            opacity: 1;
            max-height: 500px;
            overflow: hidden;
        }

        .size-panel.minimized .toolbar-group,
        .size-panel.minimized .toolbar-input-group {
            opacity: 0;
            max-height: 0;
            margin: 0;
            padding: 0;
        }

        .size-panel.dragging {
            cursor: grabbing;
        }

        .side-panel.dragging {
            cursor: grabbing;
        }

        .side-panel-resize {
            position: absolute;
            right: 0;
            top: 0;
            width: 8px;
            height: 100%;
            cursor: ew-resize;
            background: transparent;
            z-index: 1001;
        }

        .side-panel-resize:hover {
            background: rgba(139, 92, 246, 0.3);
        }

        /* Hide resize for narrow toolbar */
        .side-panel {
            resize: none;
        }

        .side-panel-section {
            padding: 15px;
            border-bottom: 2px solid #8b5cf6;
        }

        .side-panel-section:last-child {
            border-bottom: none;
        }

        .side-panel-section h3 {
            color: #ffcc00;
            font-size: 18px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0;
            margin: 0;
        }

        .tile-category {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .tile-category::before {
            width: 100%;
            font-size: 12px;
            color: #8b5cf6;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .tile-category::before {
            content: attr(data-label);
            width: 100%;
            font-size: 14px;
            color: #8b5cf6;
            margin-bottom: 5px;
        }

        .tile-btn {
            width: 42px;
            height: 42px;
            border: 3px solid #444;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            image-rendering: pixelated;
            background-size: cover;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-btn:hover {
            transform: scale(1.15);
            border-color: #ffcc00;
            z-index: 10;
        }

        .tile-btn.selected {
            border-color: #00ff88;
            box-shadow: 0 0 15px #00ff88, inset 0 0 10px rgba(0,255,136,0.3);
        }

        .tile-btn .code {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #666;
        }

        .tile-btn .icon {
            font-size: 22px;
            text-shadow: 1px 1px 0 #000;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
            padding: 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls label {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls input[type="number"] {
            width: 60px;
            padding: 6px;
            border: 2px solid #8b5cf6;
            border-radius: 5px;
            background: #0a0a1a;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }

        button {
            padding: 8px 14px;
            background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%);
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            border: 2px solid #a78bfa;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.5);
            background: linear-gradient(180deg, #a78bfa 0%, #8b5cf6 100%);
        }

        button.danger {
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
            border-color: #f87171;
        }

        button.success {
            background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
            border-color: #4ade80;
        }

        button.warning {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            border-color: #fbbf24;
            color: #000;
        }

        .editor-wrapper {
            background: linear-gradient(180deg, #1e1b4b 0%, #0f0a1e 100%);
            border: 3px solid #8b5cf6;
            border-radius: 8px;
            padding: 15px;
            overflow: auto; /* wrapper scrolls */
            width: 100%;
            max-width: 100%;
            height: 70vh;
            min-height: 480px;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3), inset 0 0 30px rgba(0,0,0,0.5);
        }

        .tile-palette-container {
            background: linear-gradient(180deg, #2c1654 0%, #1a0a2e 100%);
            border: 3px solid #8b5cf6;
            border-radius: 8px;
            padding: 10px;
            margin: 0 auto 12px auto;
            width: 90%;
            max-width: 1400px;
            max-height: 260px;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .tile-palette-container h3 {
            color: #ffcc00;
            font-size: 18px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        #level-grid {
            display: grid;
            gap: 0;
            background: #333;
            border: 2px solid #333;
            width: fit-content;
            position: relative;
        }

        .grid-header-row {
            display: grid;
            gap: 0;
            background: #222;
            border-bottom: 2px solid #555;
        }

        .grid-header-col {
            display: grid;
            gap: 0;
            background: #222;
            border-right: 2px solid #555;
        }

        .header-cell {
            width: 28px;
            height: 20px;
            background: #444;
            color: #ffcc00;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(0,0,0,0.5);
            font-weight: bold;
        }

        .cell {
            width: 28px;
            height: 28px;
            background: #3898fc;
            cursor: crosshair;
            transition: background-color 0.05s;
            image-rendering: pixelated;
            background-size: cover;
            border-right: 1px solid rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            position: relative;
        }

        .cell:hover {
            outline: 2px solid #fff;
            outline-offset: -2px;
            z-index: 5;
        }

        .cell.selected {
            outline: 3px solid #00ff88;
            outline-offset: -3px;
            background-color: rgba(0, 255, 136, 0.2) !important;
            z-index: 6;
        }

        .cell.selecting {
            outline: 2px dashed #ffcc00;
            outline-offset: -2px;
            z-index: 7;
        }

        .cell.pipe-highlight {
            outline: 3px solid #ff6b6b;
            outline-offset: -3px;
            background-color: rgba(255, 107, 107, 0.3) !important;
            z-index: 8;
            animation: pipePulse 0.5s ease-in-out;
        }

        .cell.pipe-source {
            outline: 3px solid #4a90e2;
            outline-offset: -3px;
            background-color: rgba(74, 144, 226, 0.3) !important;
            z-index: 8;
            animation: pipeSourcePulse 0.5s ease-in-out;
        }

        .cell.pipe-target {
            outline: 3px solid #9b59b6;
            outline-offset: -3px;
            background-color: rgba(155, 89, 182, 0.3) !important;
            z-index: 8;
            animation: pipeTargetPulse 0.5s ease-in-out;
        }

        @keyframes pipePulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7);
            }
            50% {
                box-shadow: 0 0 20px 10px rgba(255, 107, 107, 0.3);
            }
        }

        @keyframes pipeSourcePulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(74, 144, 226, 0.7);
            }
            50% {
                box-shadow: 0 0 20px 10px rgba(74, 144, 226, 0.3);
            }
        }

        @keyframes pipeTargetPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(155, 89, 182, 0.7);
            }
            50% {
                box-shadow: 0 0 20px 10px rgba(155, 89, 182, 0.3);
            }
        }

        .select-mode-active {
            background: rgba(0, 255, 136, 0.3) !important;
            border-color: #00ff88 !important;
        }

        .cell.underground {
            background-color: #000;
        }

        .output-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin: 10px auto 0 auto;
            width: 100%;
            max-height: 24vh;
            overflow: auto; /* keep outputs inside viewport */
            justify-content: center;
            align-items: flex-start;
        }

        .output-section {
            position: relative;
            background: linear-gradient(180deg, #2c1654 0%, #1a0a2e 100%);
            padding: 10px;
            border-radius: 8px;
            border: 3px solid #8b5cf6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
            transition: width 0.3s ease, height 0.3s ease, min-width 0.3s ease, min-height 0.3s ease, max-width 0.3s ease, max-height 0.3s ease, padding 0.3s ease;
            width: 300px;
            min-width: 200px;
            min-height: 100px;
            overflow: hidden;
        }

        .output-section.expanded {
            width: 400px;
            min-width: 350px;
            height: auto;
            min-height: auto;
            max-height: none;
        }

        .output-section.minimized {
            width: 60px;
            min-width: 60px;
            max-width: 60px;
            height: 60px;
            min-height: 60px;
            max-height: 60px;
            padding: 0;
        }

        .output-content {
            transition: opacity 0.3s ease, max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
            opacity: 1;
            max-height: 2000px;
            overflow: hidden;
        }

        .output-section.minimized .output-content {
            opacity: 0;
            max-height: 0;
            padding: 0;
            margin: 0;
        }

        .output-section.minimized .output-header h3 {
            display: none;
        }

        .output-section.minimized .output-header {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .output-section.minimized .minimize-btn {
            width: auto;
            height: auto;
            padding: 0;
            font-size: 16px;
            background: transparent;
            border: none;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .output-section.minimized .output-header > div {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .output-section.expanded .output-content {
            display: block;
        }

        .output-section.minimized h3 {
            font-size: 14px;
        }

        .output-header {
            cursor: pointer;
            padding: 8px 4px;
            background: rgba(139, 92, 246, 0.2);
            border-bottom: 2px solid #8b5cf6;
            user-select: none;
            text-align: center;
            margin-bottom: 8px;
            transition: background 0.2s ease, margin-bottom 0.3s ease, padding 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .output-section.minimized .output-header {
            margin-bottom: 0;
            border-bottom: none;
        }

        .output-header:hover {
            background: rgba(139, 92, 246, 0.4);
        }

        .output-header:active {
            background: rgba(139, 92, 246, 0.5);
        }

        .output-section.dragging {
            cursor: grabbing;
        }

        .output-section-resize {
            position: absolute;
            right: 0;
            top: 0;
            width: 8px;
            height: 8px;
            cursor: nwse-resize;
            background: rgba(139, 92, 246, 0.2);
            z-index: 100;
            border-radius: 0 0 0 4px;
            display: none; /* Hidden by default, shown when expanded */
            pointer-events: auto;
        }

        .output-section .output-section-resize {
            display: block;
        }

        .output-section-resize:hover {
            background: rgba(139, 92, 246, 0.5);
        }

        .output-section-resize-width {
            position: absolute;
            right: 0;
            top: 0;
            width: 8px;
            height: 100%;
            cursor: ew-resize;
            background: transparent;
            z-index: 99;
            display: none; /* Hidden by default, shown when expanded */
            pointer-events: auto;
        }

        .output-section .output-section-resize-width {
            display: block;
        }

        .output-section-resize-width:hover {
            background: rgba(139, 92, 246, 0.2);
        }

        .output-section-resize-height {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 8px;
            cursor: ns-resize;
            background: transparent;
            z-index: 99;
            display: none; /* Hidden by default, shown when expanded */
            pointer-events: auto;
        }

        // Flatten for lookup
        const TILES = Object.values(TILE_CATEGORIES).flat();

        let selectedTile = TILES[0];
        let gridData = [];
        let undoStack = [];
        let redoStack = [];
        let isMouseDown = false;
        let lastPainted = null;
        let cols = 60;
        let rows = 17;
        let zoomLevel = 50; // Zoom level in percentage (further reduced to show more at once)

        function createToolbar() {
            const toolbar = document.getElementById('toolbar');
            toolbar.innerHTML = '';
            
            Object.entries(TILE_CATEGORIES).forEach(([category, tiles]) => {
                const catDiv = document.createElement('div');
                catDiv.className = 'tile-category';
                catDiv.dataset.label = category.toUpperCase();
                
                tiles.forEach((tile, index) => {
                    const btn = document.createElement('div');
                    btn.className = 'tile-btn' + (tile === selectedTile ? ' selected' : '');
                    btn.style.backgroundColor = tile.color;
                    btn.title = `${tile.name} (${tile.code})`;
                    btn.innerHTML = `<span class="icon">${tile.icon}</span><span class="code">${tile.code}</span>`;
                    
                    btn.onclick = () => selectTile(tile);
                    catDiv.appendChild(btn);
                });
                
                toolbar.appendChild(catDiv);
            });
        }

        function selectTile(tile) {
            selectedTile = tile;
            document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('selected'));
            const btn = [...document.querySelectorAll('.tile-btn')].find(b => {
                const code = b.querySelector('.code').textContent;
                return code == tile.code;
            });
            if (btn) btn.classList.add('selected');
        }

        function createGrid(preserveData = false) {
            cols = parseInt(document.getElementById('cols').value);
            rows = parseInt(document.getElementById('rows').value);
            
            // Only reset gridData if we're not preserving data
            if (!preserveData) {
                gridData = Array(rows).fill(null).map(() => Array(cols).fill(0));
            } else {
                // If preserving data, ensure gridData matches the new dimensions
                // Expand or shrink as needed
                const newGridData = Array(rows).fill(null).map(() => Array(cols).fill(0));
                for (let r = 0; r < Math.min(rows, gridData.length); r++) {
                    for (let c = 0; c < Math.min(cols, gridData[r] ? gridData[r].length : 0); c++) {
                        newGridData[r][c] = gridData[r][c];
                    }
                }
                gridData = newGridData;
            }
            
            // Initialize background data array (same size as foreground)
            // Only reset if not preserving or if dimensions changed
            if (!preserveData || backgroundData.length === 0 || backgroundData.length !== rows || (backgroundData[0] && backgroundData[0].length !== cols)) {
                const newBackgroundData = Array(rows).fill(null).map(() => Array(cols).fill(0));
                if (preserveData && backgroundData.length > 0) {
                    // Preserve existing background data
                    for (let r = 0; r < Math.min(rows, backgroundData.length); r++) {
                        for (let c = 0; c < Math.min(cols, backgroundData[r] ? backgroundData[r].length : 0); c++) {
                            newBackgroundData[r][c] = backgroundData[r][c];
                        }
                    }
                }
                backgroundData = newBackgroundData;
            }
            
            undoStack = [];
            redoStack = [];
            
            // Clear selection when creating new grid
            clearSelection();
            
            const grid = document.getElementById('level-grid');
            // Add 1 for row header column, grid is (cols + 1) wide
            grid.style.gridTemplateColumns = `30px repeat(${cols}, 28px)`;
            grid.innerHTML = '';
            
            const theme = getLevelTheme();
            
            // Create header row with column numbers and pixel X values
            const headerCell = document.createElement('div');
            headerCell.className = 'header-cell';
            headerCell.textContent = '';
            headerCell.style.gridColumn = '1';
            grid.appendChild(headerCell);
            
            for (let c = 0; c < cols; c++) {
                const headerCell = document.createElement('div');
                headerCell.className = 'header-cell';
                headerCell.textContent = c + 1;  // Actual col number (1-based)
                headerCell.title = `Col ${c + 1} | Pixel X: ${c * 32}`;
                grid.appendChild(headerCell);
            }
            
            // Create grid rows with row numbers and cells
            for (let r = 0; r < rows; r++) {
                // Row header with row number and pixel Y
                const rowHeader = document.createElement('div');
                rowHeader.className = 'header-cell';
                rowHeader.textContent = r + 1;  // Actual row number (1-based)
                rowHeader.title = `Row ${r + 1} | Pixel Y: ${r * 32}`;
                grid.appendChild(rowHeader);
                
                // Cells in this row
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    // Store actual row/col (1-based) and pixel positions for tooltip
                    cell.title = `Row ${r + 1}, Col ${c + 1} | Pixel (${c * 32}, ${r * 32})`;
                    
                    cell.addEventListener('mousedown', (e) => {
                        if (e.button !== 0) return; // only left click paints/selects
                        e.preventDefault();
                        
                        // Check if Ctrl+Click to paste
                        if (e.ctrlKey && copiedSelection !== null) {
                            contextMenuRow = r;
                            contextMenuCol = c;
                            contextMenuPasteSelection();
                            return;
                        }
                        
                        if (isSelectMode) {
                            // Selection mode
                            if (e.shiftKey && selectedCells.size > 0) {
                                // Add to selection
                                const key = `${r},${c}`;
                                if (selectedCells.has(key)) {
                                    selectedCells.delete(key);
                                } else {
                                    selectedCells.add(key);
                                }
                            } else {
                                // Start new selection
                                selectionStart = { row: r, col: c };
                                selectionEnd = { row: r, col: c };
                                selectedCells.clear();
                                selectedCells.add(`${r},${c}`);
                            }
                            updateSelectionDisplay();
                            updateSelectionButtons();
                        } else {
                            // Normal paint mode
                            isMouseDown = true;
                            lastPainted = null;
                            saveUndo();
                            paintCell(cell, r, c);
                        }
                    });
                    
                    cell.addEventListener('mouseenter', (e) => {
                        // Track cursor position for paste
                        cursorRow = r;
                        cursorCol = c;
                        
                        if (isSelectMode && selectionStart && e.buttons === 1) {
                            // Update selection while dragging
                            selectionEnd = { row: r, col: c };
                            updateSelectionFromRect();
                            updateSelectionDisplay();
                        } else if (isMouseDown && !isSelectMode) {
                            paintCell(cell, r, c);
                        }
                        updateStatus(r, c);
                    });
                    
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        showContextMenu(e, r, c);
                    });
                    
                    grid.appendChild(cell);
                }
            }
            
            // Ensure browser context menu never appears on grid cells
            const levelGrid = document.getElementById('level-grid');
            if (levelGrid && !levelGrid.dataset.ctxGuard) {
                levelGrid.addEventListener('contextmenu', (e) => {
                    const cell = e.target.closest('.cell');
                    if (cell) {
                        e.preventDefault();
                        const r = parseInt(cell.dataset.row, 10);
                        const c = parseInt(cell.dataset.col, 10);
                        showContextMenu(e, r, c);
                    }
                });
                levelGrid.dataset.ctxGuard = '1';
            }
            
            updateOutput();
        }

        function saveUndo() {
            undoStack.push(JSON.stringify(gridData));
            if (undoStack.length > 50) undoStack.shift();
            redoStack = [];
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(JSON.stringify(gridData));
            gridData = JSON.parse(undoStack.pop());
            refreshGrid();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(JSON.stringify(gridData));
            gridData = JSON.parse(redoStack.pop());
            refreshGrid();
        }

        function refreshGrid() {
            const cells = document.querySelectorAll('.cell');
            let i = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (cells[i]) {
                        // Always show foreground tile if present, otherwise background tile
                        const fgCode = gridData[r] && gridData[r][c] ? gridData[r][c] : 0;
                        const bgCode = backgroundData[r] && backgroundData[r][c] ? backgroundData[r][c] : 0;
                        const displayCode = fgCode || bgCode;
                        updateCellDisplay(cells[i], displayCode);
                        // Update tooltip with actual row/col and pixels
                        const actualRow = r + 1;
                        const actualCol = c + 1;
                        cells[i].title = `Row ${actualRow}, Col ${actualCol} | Pixel (${c * 32}, ${r * 32})`;
                    }
                    i++;
                }
            }
            // Restore selection display after refresh
            if (isSelectMode) {
                updateSelectionDisplay();
            }
            // Don't automatically extract pipes - they should only appear when linked
            // Only prune pipes that are no longer valid tiles
            prunePipeData();
            updateOutput();
        }

        function isBackgroundTile(code) {
            // Background tiles that go in background layer: 80-86 (from background.bmp)
            return code >= 80 && code <= 86;
        }
        
        function updatePlatformMetadata(row, col, code) {
            const key = `${col * 32},${row * 32}`;
            if (code === 60 || code === 61 || code === 62) {
                const existing = platformProps[key] || {};
                const type = existing.type || (code === 61 ? 'vertical' : code === 62 ? 'static' : 'horizontal');
                const width = Math.max(1, parseInt(existing.width, 10) || 3);
                const speed = Math.max(1, parseInt(existing.speed, 10) || 1);
                const wrapMode = Math.max(0, Math.min(2, parseInt(existing.wrapMode, 10) || 0));
                const range = Math.max(0, parseInt(existing.range, 10) || 0);
                platformProps[key] = { type, width, speed, wrapMode, range };
            } else {
                if (platformProps[key]) {
                    delete platformProps[key];
                }
            }
        }

        function updateFirebarMetadata(row, col, code) {
            const key = `${col * 32},${row * 32}`;
            if (code === 75) {
                const existing = firebarProps[key] || { length: 4, speed: 2, dir: 1 };
                firebarProps[key] = existing;
            } else if (firebarProps[key]) {
                delete firebarProps[key];
                // Update firebars list immediately when removed
                const firebarEntries = getFirebarEntries();
                updateFirebarsList(firebarEntries);
                saveGridData();
            }
        }

        function rebuildFirebarData() {
            const next = {};
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (gridData[r] && gridData[r][c] === 75) {
                        const key = `${c * 32},${r * 32}`;
                        const existing = firebarProps[key] || { length: 4, speed: 2, dir: 1 };
                        const length = Math.min(8, Math.max(1, parseInt(existing.length, 10) || 4));
                        const speed = Math.max(1, parseInt(existing.speed, 10) || 2);
                        const dir = (existing.dir === 0 || existing.dir === 1) ? existing.dir : 1;
                        next[key] = { length, speed, dir };
                    }
                }
            }
            firebarProps = next;
        }

        function getPlatformEntries() {
            const entries = [];
            for (const [key, meta] of Object.entries(platformProps)) {
                const [xStr, yStr] = key.split(',');
                const x = parseInt(xStr, 10);
                const y = parseInt(yStr, 10);
                if (isNaN(x) || isNaN(y)) continue;
                const type = meta.type || 'horizontal';
                const width = Math.max(1, parseInt(meta.width, 10) || 3);
                const speed = Math.max(1, parseInt(meta.speed, 10) || 1);
                const wrapMode = Math.max(0, Math.min(2, parseInt(meta.wrapMode, 10) || 0));
                const range = Math.max(0, parseInt(meta.range, 10) || 0);
                // Export leftmost X and topmost Y (not center)
                const leftX = x;
                const topY = y;
                const moveType = type === 'vertical' ? 1 : type === 'static' ? 2 : 0;
                entries.push({ x: leftX, y: topY, width, moveType, wrapMode, range, speed, keyX: x, keyY: y });
            }
            return entries;
        }

        function getFirebarEntries() {
            rebuildFirebarData();
            const entries = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (gridData[r] && gridData[r][c] === 75) {
                        const key = `${c * 32},${r * 32}`;
                        const meta = firebarProps[key] || { length: 4, speed: 2, dir: 1 };
                        entries.push({
                            x: c * 32,
                            y: r * 32,
                            length: meta.length,
                            speed: meta.speed,
                            dir: (meta.dir === 0 || meta.dir === 1) ? meta.dir : 1
                        });
                    }
                }
            }
            return entries;
        }
        
        function isPipeTile(code) {
            // Pipe tiles: vertical in (18), out (19), horizontal in (20)
            // All pipe tiles should be included in pipe data extraction
            return code === 18 || code === 19 || code === 20;
        }

        function paintCell(cell, row, col) {
            const key = `${row},${col}`;
            if (lastPainted === key) return;
            lastPainted = key;
            
            const code = selectedTile.code;
            
            // Check if we're removing a pipe tile (before updating gridData)
            const oldTile = gridData[row] && gridData[row][col] ? gridData[row][col] : 0;
            const wasPipe = isPipeTile(oldTile);
            const isPipe = isPipeTile(code);
            
            // Background tiles go to the background layer; everything else goes foreground
            if (isBackgroundTile(code)) {
                if (!backgroundData[row]) {
                    backgroundData[row] = [];
                }
                backgroundData[row][col] = code;
                // Clear foreground at this position
                gridData[row][col] = 0;
            } else {
                // Regular tile goes in foreground layer
                gridData[row][col] = code;
                // Clear background at this position
                if (backgroundData[row] && backgroundData[row][col]) {
                    backgroundData[row][col] = 0;
                }
            }
            
            updatePlatformMetadata(row, col, code);
            const wasFirebar = oldTile === 75;
            const isFirebar = code === 75;
            updateFirebarMetadata(row, col, code);
            
            // If firebar was removed, update list and save
            if (wasFirebar && !isFirebar) {
                const firebarEntries = getFirebarEntries();
                updateFirebarsList(firebarEntries);
                saveGridData();
            }
            
            updateCellDisplay(cell, code);
            updateOutput();
            
            // Extract pipes when placed - show them immediately in the list
            if ((isPipe || wasPipe) && !pipeDataLoadedFromFile) {
                extractPipesFromLevel();
            }
        }
        

        function getLevelTheme() {
            // Get level number (1-4) and map to theme
            // Level 1 = overworld (0), Level 2 = underground (1), Level 3 = sky (2), Level 4 = castle (3)
            const levelNum = parseInt(document.getElementById('level-num').value || '1');
            return levelNum - 1;  // 0, 1, 2, 3
        }

        // No sprite rendering - using color/icon display only

        function updateCellDisplay(cell, code) {
    const tile = TILES.find(t => t.code === code) || TILES[0];
    const theme = getLevelTheme();  // 0=overworld, 1=underground, 2=sky, 3=castle

    // Clear cell
    cell.innerHTML = '';
    cell.style.backgroundImage = 'none';
    cell.style.backgroundSize = '';
    cell.style.backgroundPosition = '';

    if (code === 0) {
        // Air
        if (theme === 1 || theme === 3) {
            cell.style.backgroundColor = '#000000';
        } else {
            cell.style.backgroundColor = '#3898fc';
        }
        return;
    }

    // Determine color based on tile + theme
    let displayColor = tile.color;

    if (code === 1) { // Ground
        displayColor = (theme === 1) ? '#00a8a8' :
                       (theme === 3) ? '#a04000' : '#c05800';
    }
    else if (code === 2) { // Brick
        displayColor = (theme === 1) ? '#00a8a8' :
                       (theme === 3) ? '#a04000' : '#c04800';
    }
    else if (code === 4) { // Stair
        displayColor = (theme === 1) ? '#00a8a8' :
                       (theme === 3) ? '#a04000' : '#c04800';
    }

    // Apply style
    cell.style.backgroundColor = displayColor;
    cell.innerHTML = `<span style="color:#000;text-shadow:1px 1px 0 rgba(255,255,255,0.5)">${tile.icon}</span>`;
}

        function updateStatus(row, col) {
            const statusEl = document.getElementById('status');
            if (statusEl) {
                const fgCode = gridData[row] && gridData[row][col] ? gridData[row][col] : 0;
                const bgCode = backgroundData[row] && backgroundData[row][col] ? backgroundData[row][col] : 0;
                const tileCode = fgCode || bgCode;
                const tile = TILES.find(t => t.code === tileCode) || TILES[0];
                const actualRow = row + 1;  // Convert 0-based to 1-based
                const actualCol = col + 1;  // Convert 0-based to 1-based
                const pixelX = col * 32;    // TILE_SIZE = 32
                const pixelY = row * 32;
                statusEl.textContent = `Row: ${actualRow} | Col: ${actualCol} | Pixel: (${pixelX}, ${pixelY}) | Tile: ${tile.name} (${tile.code})`;
            }
        }

        function clearGrid() {
            if (confirm('Clear the entire grid?')) {
                saveUndo();
                gridData = Array(rows).fill(null).map(() => Array(cols).fill(0));
                backgroundData = Array(rows).fill(null).map(() => Array(cols).fill(0));
                pipeData = [];
                platformProps = {};
                firebarProps = {};
                refreshGrid();
            }
        }


        function saveGridData() {
            // Ensure pipeData has all required properties before saving
            const sanitizedPipeData = pipeData.map(p => ({
                x: p.x || 0,
                y: p.y || 0,
                direction: (typeof p.direction === 'number') ? p.direction : (p.direction === 0 ? 0 : 1),
                linkKey: p.linkKey || null
            }));
            
            const gridState = {
                rows: rows,
                cols: cols,
                gridData: gridData,
                backgroundData: backgroundData,
                levelNum: parseInt(document.getElementById('level-num').value || '1'),
                pipeData: sanitizedPipeData,
                platformProps: platformProps,
                firebarProps: firebarProps,
            };
            localStorage.setItem('gridState', JSON.stringify(gridState));
        }

        function loadGridData() {
            const saved = localStorage.getItem('gridState');
            if (!saved) return false;
            
            try {
                const gridState = JSON.parse(saved);
                
                // Restore grid size
                rows = gridState.rows || 17;
                cols = gridState.cols || 60;
                
                // Update input fields
                document.getElementById('rows').value = rows;
                document.getElementById('cols').value = cols;
                if (gridState.levelNum) {
                    document.getElementById('level-num').value = gridState.levelNum;
                }
                
                // Restore grid data
                if (gridState.gridData && Array.isArray(gridState.gridData)) {
                    gridData = gridState.gridData;
                }
                
                // Restore background data
                if (gridState.backgroundData && Array.isArray(gridState.backgroundData)) {
                    backgroundData = gridState.backgroundData;
                }
                
                // Restore platform metadata
                if (gridState.platformProps && typeof gridState.platformProps === 'object') {
                    platformProps = gridState.platformProps;
                }
                
                if (gridState.firebarProps && typeof gridState.firebarProps === 'object') {
                    firebarProps = gridState.firebarProps;
                }
                
                // Restore pipe data (preserve order from localStorage)
                if (gridState.pipeData && Array.isArray(gridState.pipeData)) {
                    pipeData = gridState.pipeData.map(p => ({
                        x: p.x || 0,
                        y: p.y || 0,
                        direction: (typeof p.direction === 'number') ? p.direction : (p.direction === 0 ? 0 : 1),
                        linkKey: p.linkKey || null
                    }));
                    // Mark that pipes were loaded from localStorage to prevent extractPipesFromLevel from overwriting
                    pipeDataLoadedFromFile = true;
                    // Update pipes list display after loading
                    updatePipesList();
                }
                
                
                return true;
            } catch (e) {
                console.error('Failed to load grid data:', e);
                return false;
            }
        }

        function updateOutput() {
            // Update foreground level output (background tiles not shown in output)
            const output = gridData.map(row => row.join(',')).join('\n');
            document.getElementById('output').value = output;
            
            // Background output removed - background tiles are not exported
            
            // Firebars
            const firebarEntries = getFirebarEntries();
            const firebarOutput = firebarEntries.map(f => `${f.x} ${f.y} ${f.length} ${f.speed} ${f.dir}`).join('\n');
            updateFirebarsList(firebarEntries);
            
            // Platforms
            const platformEntries = getPlatformEntries();
            updatePlatformsList(platformEntries);
            
            // Update pipes output (format: X Y DIRECTION)
            // Includes both pipe IN (18, 20) and pipe OUT (19) tiles
            // Ensure direction is 0 or 1 (don't use || because 0 is falsy!)
            prunePipeData();
            const orderedPipes = getOrderedPipes();
            const pipesOutput = orderedPipes.map(pipe => {
                const dir = (pipe.direction === 0 || pipe.direction === 1) ? pipe.direction : 0;
                return `${pipe.x} ${pipe.y} ${dir}`;
            }).join('\n');
            updatePipesList();
            
            // Save grid data whenever output is updated
            saveGridData();
        }
        
        
        function copyPipesToClipboard() {
            // Ensure direction is 0 or 1 (don't use || because 0 is falsy!)
            const pipesOutput = getOrderedPipes().map(pipe => {
                const dir = (pipe.direction === 0 || pipe.direction === 1) ? pipe.direction : 0;
                return `${pipe.x} ${pipe.y} ${dir}`;
            }).join('\n');
            const textarea = document.createElement('textarea');
            textarea.value = pipesOutput;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('Pipes data copied to clipboard!');
        }

        // Convenience: open pipe properties for a given pixel coordinate
        function openPipePropertiesAt(xPixel, yPixel) {
            const gridCol = Math.floor(xPixel / 32);
            const gridRow = Math.floor(yPixel / 32);
            contextMenuRow = gridRow;
            contextMenuCol = gridCol;

            let entry = findPipeEntry(xPixel, yPixel);
            if (!entry) {
                extractPipesFromLevel();
                entry = findPipeEntry(xPixel, yPixel);
            }
            if (!entry) return;

            const tileCode = (gridData[gridRow] && gridData[gridRow][gridCol]) ? gridData[gridRow][gridCol] : 0;
            const currentDir = (entry.direction === 0 || entry.direction === 1) ? entry.direction : (tileCode === 20 ? 0 : 1);
            openPropertiesPanel('pipe', {
                entry,
                currentDir,
                index: pipeData.findIndex(p => pipeKey(p.x, p.y) === pipeKey(xPixel, yPixel)),
                tileCode
            });
        }

        // Update pipes list display
        function updatePipesList() {
            const pipesList = document.getElementById('pipes-list');
            if (!pipesList) return;
            
            pipesList.innerHTML = '';
            
            // Show ALL pipes - reorder so pipe IN comes before its linked pipe OUT
            if (pipeData.length === 0) {
                pipesList.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">No pipes</div>';
                return;
            }
            
            // Reorder: pipe IN first, then its linked pipe OUT
            const ordered = [];
            const visited = new Set();
            
            // First pass: add all pipe INs with their linked pipe OUTs
            pipeData.forEach(p => {
                const key = pipeKey(p.x, p.y);
                if (visited.has(key)) return;
                
                const row = Math.floor(p.y / 32);
                const col = Math.floor(p.x / 32);
                const tile = gridData[row] && gridData[row][col] ? gridData[row][col] : 0;
                const isPipeIn = (tile === 18 || tile === 20);
                
                if (isPipeIn) {
                    ordered.push(p);
                    visited.add(key);
                    
                    // Add linked pipe OUT immediately after
                    if (p.linkKey) {
                        const outKey = p.linkKey;
                        const pipeOut = pipeData.find(po => pipeKey(po.x, po.y) === outKey);
                        if (pipeOut && !visited.has(outKey)) {
                            ordered.push(pipeOut);
                            visited.add(outKey);
                        }
                    }
                }
            });
            
            // Second pass: add any remaining pipes (unlinked pipe OUTs, etc)
            pipeData.forEach(p => {
                const key = pipeKey(p.x, p.y);
                if (!visited.has(key)) {
                    ordered.push(p);
                    visited.add(key);
                }
            });
            
            // Rainbow colors for each pipe pair - more distinct colors
            const rainbowColors = [
                '#ff0000', // Bright Red
                '#00ff00', // Bright Green
                '#0000ff', // Bright Blue
                '#ffff00', // Bright Yellow
                '#ff00ff', // Magenta
                '#00ffff', // Cyan
                '#ff8000', // Orange
                '#8000ff', // Purple
                '#ff0080', // Hot Pink
                '#00ff80', // Spring Green
                '#0080ff', // Sky Blue
                '#ff8040'  // Coral
            ];
            
            let pairIndex = 0;
            ordered.forEach((pipe, displayIndex) => {
                const actualIndex = pipeData.findIndex(p => pipeKey(p.x, p.y) === pipeKey(pipe.x, pipe.y));
                const entry = document.createElement('div');
                
                // Determine if this is a pipe IN (to assign color to pairs)
                const row = Math.floor(pipe.y / 32);
                const col = Math.floor(pipe.x / 32);
                const tile = gridData[row] && gridData[row][col] ? gridData[row][col] : 0;
                const isPipeIn = (tile === 18 || tile === 20);
                
                if (isPipeIn) {
                    pairIndex = Math.floor(displayIndex / 2); // Each pair takes 2 entries
                }
                
                const colorIndex = pairIndex % rainbowColors.length;
                const borderColor = rainbowColors[colorIndex];
                entry.className = 'pipe-entry' + (pipe.linkKey ? ' pipe-linked' : '');
                entry.dataset.index = actualIndex;
                entry.style.borderColor = borderColor;
                entry.style.borderLeftWidth = '4px';
                entry.style.boxShadow = `0 0 10px ${borderColor}40`;
                
                // Ensure direction is 0 or 1
                const direction = (pipe.direction === 0 || pipe.direction === 1) ? pipe.direction : 0;
                
                entry.innerHTML = `
                    <div class="pipe-info">
                        <span class="pipe-coords">X: ${pipe.x} Y: ${pipe.y}</span>
                        <div class="pipe-direction">
                            <label>Dir:</label>
                            <input type="number" min="0" max="1" value="${direction}" 
                                   oninput="updatePipeDirection(${actualIndex}, this.value)"
                                   onchange="updatePipeDirection(${actualIndex}, this.value)" 
                                   onblur="validatePipeDirection(${actualIndex}, this)"
                                   step="1">
                        </div>
                    </div>
                `;
                
                // Update pipeData to ensure direction is correct
                pipeData[actualIndex].direction = direction;
                
                // Click handler to highlight pipe on grid
                entry.addEventListener('click', (e) => {
                    // Don't trigger if clicking on input
                    if (e.target.tagName === 'INPUT') {
                        return;
                    }
                    
                    // Convert pixel coordinates to grid coordinates
                    const gridCol = Math.floor(pipe.x / 32);
                    const gridRow = Math.floor(pipe.y / 32);
                    
                    // Find and highlight the cell
                    const cell = document.querySelector(`.cell[data-row="${gridRow}"][data-col="${gridCol}"]`);
                    if (cell) {
                        // Clear previous highlights
                        document.querySelectorAll('.cell').forEach(c => {
                            c.classList.remove('pipe-highlight');
                        });
                        
                        // Highlight this cell
                        cell.classList.add('pipe-highlight');
                        
                        // Scroll cell into view
                        cell.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                        
                        // Remove highlight after 2 seconds
                        setTimeout(() => {
                            cell.classList.remove('pipe-highlight');
                        }, 2000);
                    }

                    // Open properties directly for quick editing
                    openPipePropertiesAt(pipe.x, pipe.y);
                });
                pipesList.appendChild(entry);
            });
        }

        function updatePipeDirection(index, value) {
            if (index < 0 || index >= pipeData.length) return;
            
            let dir = parseInt(value, 10);
            if (isNaN(dir)) {
                dir = 0;
            }
            
            // Clamp to 0 or 1
            if (dir < 0 || (dir !== 0 && dir !== 1)) {
                dir = 0;
            } else if (dir > 1) {
                dir = 1;
            }
            
            // Ensure it's exactly 0 or 1
            dir = dir === 0 ? 0 : 1;
            
            pipeData[index].direction = dir;
            
            // Update the input value to ensure it matches
            const input = document.querySelector(`#pipes-list .pipe-entry[data-index="${index}"] input[type="number"]`);
            if (input) {
                input.value = dir;
            }
            
            // Debug log
            console.log(`Updated pipe ${index} direction to ${dir}, pipeData:`, pipeData[index]);
            
            updateOutput();
        }

        function validatePipeDirection(index, input) {
            if (index < 0 || index >= pipeData.length) return;
            
            let value = parseInt(input.value, 10);
            if (isNaN(value)) {
                value = 0;
            }
            
            // Clamp to 0 or 1
            if (value < 0 || (value !== 0 && value !== 1)) {
                value = 0;
            } else if (value > 1) {
                value = 1;
            }
            
            // Ensure it's exactly 0 or 1
            value = value === 0 ? 0 : 1;
            
            input.value = value;
            pipeData[index].direction = value;
            updateOutput();
        }

        function movePipeEntry(fromIndex, toIndex) {
            const item = pipeData.splice(fromIndex, 1)[0];
            pipeData.splice(toIndex, 0, item);
            updatePipesList();
            updateOutput();
            // Explicitly save after reordering pipes to preserve order
            saveGridData();
        }



        // Separate data storage for all three layers
        let pipeData = [];           // Pipes: X Y coordinates (+ direction/link)
        let pipeDataLoadedFromFile = false;  // Flag to prevent overwriting pipeData from extractPipesFromLevel
        let backgroundData = [];     // Background: same format as gridData but for decorations
        let platformProps = {};      // Extra platform metadata keyed by "x,y"
        let firebarProps = {};       // Firebar metadata keyed by "x,y"
        
        // Store directory handle for silent file saving
        let levelsDirHandle = null;
        
        // No sprite sheets - using color/icon display only

        async function exportAll() {
            const levelNum = document.getElementById('level-num').value || '1';
            
            // Export all tiles - combine foreground and background (foreground takes priority, fallback to background)
            const levelOutput = gridData.map((row, r) => {
                return row.map((fgCode, c) => {
                    const bgCode = backgroundData[r] && backgroundData[r][c] ? backgroundData[r][c] : 0;
                    // Use foreground tile if present, otherwise use background tile
                    return fgCode || bgCode;
                }).join(',');
            }).join('\n');
            const orderedPipes = getOrderedPipes();
            const pipesOutput = orderedPipes.length > 0 ? orderedPipes.map(pipe => {
                // Ensure direction is 0 or 1 (don't use || because 0 is falsy!)
                // Use strict equality check to preserve 0 values
                let dir;
                if (pipe.direction === 0) {
                    dir = 0;
                } else if (pipe.direction === 1) {
                    dir = 1;
                } else {
                    dir = 0; // Default to 0 if invalid
                }
                console.log(`Exporting pipe: x=${pipe.x}, y=${pipe.y}, direction=${pipe.direction}, exported=${dir}`);
                return `${pipe.x} ${pipe.y} ${dir}`;
            }).join('\n') : '';
            const firebarEntries = getFirebarEntries();
            const firebarOutput = firebarEntries.length > 0 ? firebarEntries.map(f => `${f.x} ${f.y} ${f.length} ${f.speed} ${f.dir}`).join('\n') : '';
            const platformEntries = getPlatformEntries();
            const platformOutput = platformEntries.length > 0 ? platformEntries.map(p => `${p.x} ${p.y} ${p.width} ${p.moveType} ${p.wrapMode} ${p.range} ${p.speed}`).join('\n') : '';
            
            // Check if File System Access API is supported
            if (!window.showDirectoryPicker) {
                alert('File System Access API not supported in this browser. Please use Chrome, Edge, or Opera.');
                return;
            }
            
            try {
                // Request access to the directory where the HTML file is located
                // User should select the project root directory (where level_editor.html is)
                if (!levelsDirHandle) {
                    const rootHandle = await window.showDirectoryPicker({
                        id: 'coalproject-root',
                        mode: 'readwrite'
                    });
                    
                    // Get or create the 'levels' subdirectory
                    try {
                        levelsDirHandle = await rootHandle.getDirectoryHandle('levels', { create: true });
                    } catch (err) {
                        console.error('Failed to access/create levels folder:', err);
                        alert('Failed to access/create levels folder. Please make sure you have permission to create folders.');
                        return;
                    }
                }
                
                // Always save all 3 files, even if empty
                
                // Save level file (all tiles - foreground and background combined)
                const levelFileHandle = await levelsDirHandle.getFileHandle(`level${levelNum}.txt`, { create: true });
                const levelWritable = await levelFileHandle.createWritable();
                await levelWritable.write(new Blob([levelOutput], { type: 'text/plain' }));
                await levelWritable.close();
                
                // Save pipes file (always export, even if empty)
                const pipesFileHandle = await levelsDirHandle.getFileHandle(`level${levelNum}_pipes.txt`, { create: true });
                const pipesWritable = await pipesFileHandle.createWritable();
                await pipesWritable.write(new Blob([pipesOutput || ''], { type: 'text/plain' }));
                await pipesWritable.close();
                
                // Save firebars file (always export, even if empty)
                const firebarsFileHandle = await levelsDirHandle.getFileHandle(`level${levelNum}firebars.txt`, { create: true });
                const firebarsWritable = await firebarsFileHandle.createWritable();
                await firebarsWritable.write(new Blob([firebarOutput || ''], { type: 'text/plain' }));
                await firebarsWritable.close();
                
                // Save platforms file (always export, even if empty)
                const platformsFileHandle = await levelsDirHandle.getFileHandle(`level${levelNum}platforms.txt`, { create: true });
                const platformsWritable = await platformsFileHandle.createWritable();
                await platformsWritable.write(new Blob([platformOutput || ''], { type: 'text/plain' }));
                await platformsWritable.close();
                
                // Show success message
                alert(`Level ${levelNum} - Files saved!\n- level${levelNum}.txt (all tiles - foreground and background)\n- level${levelNum}_pipes.txt\n- level${levelNum}firebars.txt\n- level${levelNum}platforms.txt`);
            } catch (err) {
                if (err.name === 'AbortError') {
                    // User cancelled directory picker
                    return;
                }
                console.error('Failed to save files:', err);
                alert('Failed to save: ' + err.message);
            }
        }

        function importAll() {
            // Use a single file input with multiple file selection
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt';
            input.multiple = true;  // Allow selecting multiple files at once
            
            input.onchange = (e) => {
                const files = Array.from(e.target.files);
                
                // Process each file based on its name
            let levelFile = null;
            let pipesFile = null;
            let firebarsFile = null;
            let platformsFile = null;
                
                let detectedLevel = null;
                files.forEach(file => {
                    const name = file.name.toLowerCase();
                    // Auto-detect level number from filename (e.g., level1.txt, level2_pipes.txt)
                    const levelMatch = name.match(/level(\d+)/);
                    if (levelMatch) {
                        const levelNum = parseInt(levelMatch[1], 10);
                        if (levelNum >= 1 && levelNum <= 4) {
                            detectedLevel = levelNum;
                        }
                    }
                    
                    if (name.includes('firebar')) {
                        firebarsFile = file;
                    } else if (name.includes('platform')) {
                        platformsFile = file;
                    } else if (name.includes('pipe')) {
                        pipesFile = file;
                    } else if (!name.includes('background')) {
                        // Default to level file if not background or pipe
                        levelFile = file;
                    }
                    // Background files are ignored - all tiles are in the main level file
                });
                
                // Set detected level number
                if (detectedLevel !== null) {
                    const levelNumInput = document.getElementById('level-num');
                    if (levelNumInput) {
                        levelNumInput.value = detectedLevel;
                    }
                }
                
                // Read and process files
                let filesProcessed = 0;
                const totalFiles = (levelFile ? 1 : 0) + (pipesFile ? 1 : 0) + (firebarsFile ? 1 : 0) + (platformsFile ? 1 : 0);
                
                if (totalFiles === 0) {
                    alert('No files selected!');
                    return;
                }
                
                function checkAllProcessed() {
                    filesProcessed++;
                    if (filesProcessed === totalFiles) {
                        // All files loaded - now save to localStorage
                        // Use setTimeout to ensure all async operations complete
                        setTimeout(() => {
                            // Refresh grid first (this might modify data)
                            refreshGrid();
                            // Reset flag after refresh so future edits can extract pipes
                            pipeDataLoadedFromFile = false;
                            // Now save everything to localStorage AFTER all operations
                            saveGridData();
                            // Also call updateOutput to ensure everything is synced (this also saves)
                            updateOutput();
                            console.log('Import complete - data saved to localStorage');
                            alert('All files imported successfully!');
                        }, 300);
                    }
                }
                
                if (levelFile) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        loadFromText(event.target.result);
                        checkAllProcessed();
                    };
                    reader.readAsText(levelFile);
                }
                
                if (pipesFile) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        loadPipesFromText(event.target.result);
                        checkAllProcessed();
                    };
                    reader.readAsText(pipesFile);
                }

                if (firebarsFile) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        loadFirebarsFromText(event.target.result);
                        checkAllProcessed();
                    };
                    reader.readAsText(firebarsFile);
                }
                
                if (platformsFile) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        loadPlatformsFromText(event.target.result);
                        checkAllProcessed();
                    };
                    reader.readAsText(platformsFile);
                }
                
            };
            
            input.click();
        }

        function loadBackgroundFromText(content) {
            // Background tiles are not imported from files - they must be edited in background view
            // This function is kept for compatibility but does nothing
            updateOutput();
            refreshGrid();
        }

        function loadPipesFromText(content) {
            // Parse X Y DIRECTION format
            const lines = content.trim().split('\n').filter(l => l.trim());
            const prevMap = new Map(pipeData.map(p => [pipeKey(p.x, p.y), p]));
            pipeData = [];
            pipeDataLoadedFromFile = true;  // Mark that pipes were loaded from file
            
            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;
                
                // Parse "X Y DIRECTION" format (direction: 1 = vertical, 0 = horizontal)
                const parts = trimmed.split(/\s+/);
                if (parts.length >= 3) {
                    const x = parseInt(parts[0], 10);
                    const y = parseInt(parts[1], 10);
                    const direction = parseInt(parts[2], 10);
                    if (!isNaN(x) && !isNaN(y) && !isNaN(direction)) {
                        pipeData.push({ x, y, direction });
                    }
                } else if (parts.length >= 2) {
                    // Legacy format: X Y (assume vertical for backward compatibility)
                    const x = parseInt(parts[0], 10);
                    const y = parseInt(parts[1], 10);
                    if (!isNaN(x) && !isNaN(y)) {
                        // Use direction of previous pipe, or default to vertical
                        const prevDirection = pipeData.length > 0 ? pipeData[pipeData.length - 1].direction : 1;
                        pipeData.push({ x, y, direction: prevDirection });
                    }
                }
            });
            
            updatePipesList();
            updateOutput();
            // Explicitly save after loading pipes data
            saveGridData();
        }

        function loadFirebarsFromText(content) {
            const lines = content.trim().split('\n').filter(l => l.trim());
            firebarProps = {};
            lines.forEach(line => {
                const parts = line.trim().split(/\s+/);
                if (parts.length >= 5) {
                    const x = parseInt(parts[0], 10);
                    const y = parseInt(parts[1], 10);
                    const length = Math.min(8, Math.max(1, parseInt(parts[2], 10) || 4));
                    const speed = Math.max(1, parseInt(parts[3], 10) || 2);
                    const dir = (parseInt(parts[4], 10) === 0) ? 0 : 1;
                    const row = Math.floor(y / 32);
                    const col = Math.floor(x / 32);
                    if (!isNaN(row) && !isNaN(col) && row >= 0 && row < rows && col >= 0 && col < cols) {
                        if (!gridData[row]) gridData[row] = [];
                        gridData[row][col] = 75;
                        const key = `${x},${y}`;
                        firebarProps[key] = { length, speed, dir };
                    }
                }
            });
            refreshGrid();
            updateOutput();
            saveGridData();
        }

        function loadPlatformsFromText(content) {
            // Clear all existing platform data first
            // Remove platform tiles (60, 61, 62) from grid and collect keys to delete
            const keysToDelete = new Set();
            for (let r = 0; r < rows; r++) {
                if (gridData[r]) {
                    for (let c = 0; c < cols; c++) {
                        const tileCode = gridData[r][c] || 0;
                        if (tileCode === 60 || tileCode === 61 || tileCode === 62) {
                            gridData[r][c] = 0;
                            // Mark platformProps key for deletion
                            const key = `${c * 32},${r * 32}`;
                            keysToDelete.add(key);
                        }
                    }
                }
            }
            
            // Clear all platformProps entries (including any not in grid)
            platformProps = {};
            
            // Now import new platforms
            const lines = content.trim().split('\n').filter(l => l.trim());
            lines.forEach(line => {
                const parts = line.trim().split(/\s+/);
                if (parts.length >= 7) {
                    const leftX = parseInt(parts[0], 10);
                    const topY = parseInt(parts[1], 10);
                    const width = Math.max(1, parseInt(parts[2], 10) || 3);
                    const moveType = Math.max(0, Math.min(2, parseInt(parts[3], 10) || 0));
                    const wrapMode = Math.max(0, Math.min(2, parseInt(parts[4], 10) || 0));
                    const range = Math.max(0, parseInt(parts[5], 10) || 0);
                    const speed = Math.max(1, parseInt(parts[6], 10) || 1);
                    // derive type string for UI convenience
                    const type = moveType === 1 ? 'vertical' : moveType === 2 ? 'static' : 'horizontal';
                    // leftX and topY are already leftmost/topmost, convert to tile placement
                    const col = Math.floor(leftX / 32);
                    const row = Math.floor(topY / 32);
                    if (!isNaN(row) && !isNaN(col) && row >= 0 && row < rows && col >= 0 && col < cols) {
                        if (!gridData[row]) gridData[row] = [];
                        gridData[row][col] = 60;
                        const key = `${col * 32},${row * 32}`;
                        platformProps[key] = { type, width, speed, wrapMode, range };
                    }
                }
            });
            refreshGrid();
            updateOutput();
            saveGridData();
        }

        function updatePipesDisplay() {
            // Display pipe count in console
            const inCount = Math.ceil(pipeData.length / 2);
            const outCount = Math.floor(pipeData.length / 2);

            // Optionally show in status or a dedicated area
