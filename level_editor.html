                console.log('Pipe coordinates:', pipesPreview + (pipeData.length > 4 ? '...' : ''));
            }
        }

        function loadFromText(content) {
            // Normalize line endings (Windows \r\n to \n) and remove any stray \r
            const normalizedContent = content.replace(/\r\n/g, '\n').replace(/\r/g, '');
            const lines = normalizedContent.trim().split('\n').filter(l => l.trim());
            
            if (lines.length === 0) return;
            
            // Calculate max columns - count comma-separated segments
            cols = 0;
            lines.forEach(line => {
                // Remove trailing comma if present, then split
                const trimmed = line.replace(/,\s*$/, '');
                const count = trimmed.split(',').length;
                if (count > cols) cols = count;
            });
            
            rows = lines.length;
            
            document.getElementById('rows').value = rows;
            document.getElementById('cols').value = cols;
            
            // Parse the data first - ensure consistent parsing
            const loadedData = lines.map((line, rowIndex) => {
                // Remove trailing comma if present
                const trimmed = line.replace(/,\s*$/, '');
                const parts = trimmed.split(',');
                const cells = [];
                
                for (let i = 0; i < cols; i++) {
                    if (i < parts.length) {
                        let v = parts[i].trim();
                        // Parse as number (all tiles are now numeric)
                        const num = parseInt(v, 10);
                        cells.push(isNaN(num) ? 0 : num);
                    } else {
                        // Pad with zeros if row is shorter
                        cells.push(0);
                    }
                }
                return cells;
            });
            
            // Build the grid (this resets gridData, but we'll restore it)
            createGrid();
            
            // Import all tiles from file - whatever is in the file goes to gridData
            gridData = loadedData;
            
            // Initialize background data (empty, since we're importing everything to gridData)
            if (backgroundData.length === 0 || backgroundData.length !== rows || (backgroundData[0] && backgroundData[0].length !== cols)) {
                backgroundData = Array(rows).fill(null).map(() => Array(cols).fill(0));
            }
            
            // Auto-extract pipe coordinates from level (tiles 18, 19, 20) if pipes not loaded separately
            if (pipeData.length === 0 && !pipeDataLoadedFromFile) {
                extractPipesFromLevel();
            }
            
            // Update display
            refreshGrid();
            updateOutput();
            // Explicitly save after loading level data
            saveGridData();
            // Explicitly save after loading level data
            saveGridData();
        }

        function extractPipesFromLevel() {
            // Extract pipe coordinates from loaded level data
            // Tile 18 = vertical pipe IN (direction 1)
            // Tile 19 = pipe OUT (used for both vertical and horizontal, direction based on context)
            // Tile 20 = horizontal pipe IN (direction 0)
            // Order: pipe IN first, then pipe OUT
            const prevMap = new Map(pipeData.map(p => [pipeKey(p.x, p.y), p]));
            const pipeInList = [];
            const pipeOutList = [];
            
            // Extract in reading order (top to bottom, left to right)
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const tile = gridData[r][c];
                    if (tile === 18 || tile === 19 || tile === 20) {
                        const x = c * 32;  // Convert to pixel coordinates
                        const y = r * 32;
                        let direction;
                        if (tile === 18) {
                            direction = 1;  // Vertical pipe IN
                        } else if (tile === 20) {
                            direction = 0;  // Horizontal pipe IN
                        } else {
                            // Tile 19 (pipe OUT) - determine direction based on previous pipe IN
                            // Look for the most recent pipe IN to determine direction
                            if (pipeInList.length > 0) {
                                direction = pipeInList[pipeInList.length - 1].direction;
                            } else {
                                direction = 1;  // Default to vertical if no pipe IN yet
                            }
                        }
                        const prev = prevMap.get(pipeKey(x, y));
                        if (prev && typeof prev.direction === 'number') {
                            direction = prev.direction;
                        }
                        const linkKey = prev && prev.linkKey ? prev.linkKey : null;
                        const pipeEntry = { x, y, direction, linkKey };
                        
                        // Separate pipe IN (18, 20) from pipe OUT (19)
                        if (tile === 18 || tile === 20) {
                            pipeInList.push(pipeEntry);
                        } else {
                            pipeOutList.push(pipeEntry);
                        }
                    }
                }
            }
            
            // Combine: pipe IN first, then pipe OUT
            pipeData = [...pipeInList, ...pipeOutList];
            
            updatePipesList();
            updateOutput();
        }

        function pipeKey(x, y) {
            return `${x},${y}`;
        }

        function findPipeEntry(x, y) {
            return pipeData.find(p => p.x === x && p.y === y);
        }

        function getOrderedPipes() {
            const ordered = [];
            const visited = new Set();
            
            // Simple: pipe IN first, then its linked pipe OUT
            pipeData.forEach(p => {
                const key = pipeKey(p.x, p.y);
                if (visited.has(key)) return;
                
                const row = Math.floor(p.y / 32);
                const col = Math.floor(p.x / 32);
                const tile = gridData[row] && gridData[row][col] ? gridData[row][col] : 0;
                const isPipeIn = (tile === 18 || tile === 20);
                
                if (isPipeIn) {
                    // Add pipe IN
                    ordered.push(p);
                    visited.add(key);
                    
                    // Add linked pipe OUT immediately after
                    if (p.linkKey) {
                        const outKey = p.linkKey;
                        const pipeOut = pipeData.find(po => pipeKey(po.x, po.y) === outKey);
                        if (pipeOut && !visited.has(outKey)) {
                            ordered.push(pipeOut);
                            visited.add(outKey);
                        } else {
                            // Check grid if not in pipeData
                            const coords = p.linkKey.split(',');
                            if (coords.length === 2) {
                                const outX = parseInt(coords[0], 10);
                                const outY = parseInt(coords[1], 10);
                                if (!isNaN(outX) && !isNaN(outY)) {
                                    const outRow = Math.floor(outY / 32);
                                    const outCol = Math.floor(outX / 32);
                                    const outTile = gridData[outRow] && gridData[outRow][outCol] ? gridData[outRow][outCol] : 0;
                                    if (outTile === 19) {
                                        const gridPipeOut = { x: outX, y: outY, direction: p.direction, linkKey: null };
                                        ordered.push(gridPipeOut);
                                        visited.add(pipeKey(outX, outY));
                                    }
                                }
                            }
                        }
                    }
                }
            });
            
            // Add any remaining pipes (unlinked pipe OUTs, etc)
            pipeData.forEach(p => {
                const key = pipeKey(p.x, p.y);
                if (!visited.has(key)) {
                    ordered.push(p);
                    visited.add(key);
                }
            });
            
            return ordered;
        }

        function prunePipeData() {
            const valid = new Set();
            const kept = [];
            pipeData.forEach(p => {
                const col = Math.floor(p.x / 32);
                const row = Math.floor(p.y / 32);
                const tile = gridData[row] && gridData[row][col] ? gridData[row][col] : 0;
                if (tile === 18 || tile === 19 || tile === 20) {
                    kept.push(p);
                    valid.add(pipeKey(p.x, p.y));
                    p.direction = (p.direction === 0 || p.direction === 1) ? p.direction : 0;
                }
            });
            kept.forEach(p => {
                if (p.linkKey && !valid.has(p.linkKey)) {
                    p.linkKey = null;
                }
            });
            pipeData = kept;
        }

        function editPipeAtContext() {

            if (!(tileCode === 18 || tileCode === 20)) return;

            const x = contextMenuCol * 32;
            const y = contextMenuRow * 32;
            let entry = findPipeEntry(x, y);
            
            // If entry doesn't exist, create it (but don't add to list until linked)
            if (!entry) {
                const direction = tileCode === 20 ? 0 : 1; // 20 = horizontal (0), 18 = vertical (1)
                entry = { x, y, direction, linkKey: null };
                pipeData.push(entry);
            }

            const currentDir = (entry.direction === 0 || entry.direction === 1) ? entry.direction : (tileCode === 20 ? 0 : 1);
            openPropertiesPanel('pipe', {
                entry,
                currentDir,
                index: pipeData.findIndex(p => pipeKey(p.x, p.y) === pipeKey(x, y)),

            });

                    // Get the current entry from pipeData to ensure we have the latest linkKey
                    const currentEntryKey = pipeKey(payload.entry.x, payload.entry.y);
                    const currentEntry = pipeData.find(p => pipeKey(p.x, p.y) === currentEntryKey) || payload.entry;
                    
                    // Save the current selected value before clearing
                    const currentValue = linkSelect.value || (currentEntry && currentEntry.linkKey ? currentEntry.linkKey : '');
                    
                    // Build options of all pipe OUT tiles (tile 19) that are NOT already linked
                    // Check the grid directly, not just pipeData, since pipe OUTs might not be in pipeData yet
                    linkSelect.innerHTML = '<option value="">None</option>';
                    const currentPipeKey = pipeKey(currentEntry.x, currentEntry.y);
                    const linkedOutKeys = new Set();
                    
                    // First, collect all pipe OUTs that are already linked to other pipe INs
                    pipeData.forEach((p) => {
                        if (p.linkKey && p.linkKey !== currentPipeKey) {
                            linkedOutKeys.add(p.linkKey);
                        }
                    });
                    
                    // Scan the entire grid for pipe OUT tiles (tile 19)
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const tile = gridData[r] && gridData[r][c] ? gridData[r][c] : 0;
                            if (tile === 19) {
                                const x = c * 32;
                                const y = r * 32;
                                const val = pipeKey(x, y);
                                
                                // Skip if this pipe OUT is already linked to a different pipe IN
                                if (linkedOutKeys.has(val)) {
                                    continue;
                                }
                                
                                const opt = document.createElement('option');
                                opt.value = val;
                                opt.textContent = `Out @ ${x},${y}`;
                                linkSelect.appendChild(opt);
                            }
                        }
                    }
                    
                    // Restore the saved value after rebuilding options
                    if (currentValue) {
                        linkSelect.value = currentValue;
                    } else {
                        linkSelect.value = '';
                    }
                    
                    // Highlight target pipe when selected (purple)
                    const updateTargetHighlight = () => {
                        const currentLinkSelect = document.getElementById('pipeLinkSelect');
                        document.querySelectorAll('.cell').forEach(c => {
                            c.classList.remove('pipe-target');
                        });
                        if (currentLinkSelect && currentLinkSelect.value) {
                            const targetPipe = pipeData.find(p => pipeKey(p.x, p.y) === currentLinkSelect.value);

                                const targetGridRow = Math.floor(targetPipe.y / 32);
                                const targetCell = document.querySelector(`.cell[data-row="${targetGridRow}"][data-col="${targetGridCol}"]`);
                                if (targetCell) {
                                    targetCell.classList.add('pipe-target');
                                }
                            }
                        }
                    };
                    
                    // Add event listener for highlighting target pipe
                    linkSelect.addEventListener('change', updateTargetHighlight);
                    
                    // Highlight initial target if one exists
                    if (payload.entry && payload.entry.linkKey) {
                        setTimeout(updateTargetHighlight, 10);

        function saveProperties() {
            if (!currentPropType || !currentPropPayload) {
                closePropertiesPanel();
                return;
            }

            if (currentPropType === 'pipe') {
                const { entry, tileCode } = currentPropPayload;
                // Get the actual entry from pipeData to ensure we're updating the right object
                const entryKey = pipeKey(entry.x, entry.y);
                const actualEntry = pipeData.find(p => pipeKey(p.x, p.y) === entryKey) || entry;
                
                const dirInput = document.getElementById('pipeDirInput');
                const linkSelect = document.getElementById('pipeLinkSelect');
                let dir = dirInput ? parseInt(dirInput.value, 10) : actualEntry.direction;
                dir = dir === 0 ? 0 : 1;
                actualEntry.direction = dir;
                if (tileCode === 18 || tileCode === 20) {
                    gridData[contextMenuRow][contextMenuCol] = dir === 0 ? 20 : 18;
                }
                // handle linking
                const prevLink = actualEntry.linkKey || null;
                if (linkSelect) {
                    const selectedKey = linkSelect.value || null;
                    // clear old link if changed
                    if (prevLink && prevLink !== selectedKey) {
                        const prevIdx = pipeData.findIndex(p => pipeKey(p.x, p.y) === prevLink);
                        if (prevIdx >= 0) pipeData[prevIdx].linkKey = null;
                        actualEntry.linkKey = null;
                    }
                    if (selectedKey) {
                        actualEntry.linkKey = selectedKey;
                        let targetIdx = pipeData.findIndex(p => pipeKey(p.x, p.y) === selectedKey);
                        
                        // If target pipe OUT doesn't exist in pipeData, create it
                        if (targetIdx < 0) {
                            // Parse coordinates from selectedKey (format: "x,y")
                            const coords = selectedKey.split(',');
                            if (coords.length === 2) {
                                const targetX = parseInt(coords[0], 10);
                                const targetY = parseInt(coords[1], 10);
                                if (!isNaN(targetX) && !isNaN(targetY)) {
                                    const targetEntry = { x: targetX, y: targetY, direction: dir, linkKey: pipeKey(actualEntry.x, actualEntry.y) };
                                    pipeData.push(targetEntry);
                                    targetIdx = pipeData.length - 1;
                                }
                            }
                        } else {
                            // Target exists, update it
                            pipeData[targetIdx].linkKey = pipeKey(actualEntry.x, actualEntry.y);
                            // sync direction both ways
                            pipeData[targetIdx].direction = dir;
                        }
                        
                        // Update pipes list to show the newly linked pair
                        updatePipesList();
                        // Update output to show both pipe IN and pipe OUT
                        updateOutput();
                        // Save to localStorage
                        saveGridData();
                    } else {
                        actualEntry.linkKey = null;
                        // Update pipes list when unlinked
                        updatePipesList();
                        // Update output
                        updateOutput();
                        // Save to localStorage
                        saveGridData();
                    }
                } else {
                    // No link selected, but make sure output is updated
                    updateOutput();
                    saveGridData();
                }
                pipeDataLoadedFromFile = false;
            } else if (currentPropType === 'platform') {
                const { key, row, col } = currentPropPayload;
                const typeInput = document.getElementById('platformTypeInput');
                const widthInput = document.getElementById('platformWidthInput');
                const wrapModeInput = document.getElementById('platformWrapModeInput');
                const speedInput = document.getElementById('platformSpeedInput');
                const rangeInput = document.getElementById('platformRangeInput');
                const typeVal = typeInput ? typeInput.value : 'horizontal';
                gridData[row][col] = 60;
                const widthVal = Math.max(1, Math.min(20, parseInt(widthInput ? widthInput.value : 3, 10) || 3));
                const wrapModeVal = Math.max(0, Math.min(2, parseInt(wrapModeInput ? wrapModeInput.value : 0, 10) || 0));
                const rangeVal = Math.max(0, parseInt(rangeInput ? rangeInput.value : 0, 10) || 0);
                const speedVal = Math.max(1, parseInt(speedInput ? speedInput.value : 1, 10) || 1);
                platformProps[key] = { type: typeVal, width: widthVal, speed: speedVal, wrapMode: wrapModeVal, range: rangeVal };
                updatePlatformMetadata(row, col, 60);
            } else if (currentPropType === 'firebar') {
                const { key, row, col } = currentPropPayload;
                const lenInput = document.getElementById('firebarLengthInput');
                const spdInput = document.getElementById('firebarSpeedInput');
                const dirInput = document.getElementById('firebarDirInput');
                const length = Math.min(8, Math.max(1, parseInt(lenInput ? lenInput.value : 4, 10) || 4));
                const speed = Math.max(1, parseInt(spdInput ? spdInput.value : 2, 10) || 2);
                const dir = (dirInput && parseInt(dirInput.value, 10) === 0) ? 0 : 1;
                firebarProps[key] = { length, speed, dir };
                gridData[row][col] = 75;
                updateFirebarMetadata(row, col, 75);
            }

            refreshGrid();
            updateOutput();
            closePropertiesPanel();
        }


        function contextMenuCutSelection() {
            if (selectedCells.size === 0) return;
            // Copy first, then delete
            contextMenuCopySelection();
            deleteSelection();
        }

        function contextMenuCopySelection() {
            if (selectedCells.size === 0) return;
            
            // Calculate selection bounds
            let minRow = Infinity, maxRow = -1, minCol = Infinity, maxCol = -1;
            selectedCells.forEach(key => {
                const [r, c] = key.split(',').map(Number);
                if (r < minRow) minRow = r;
                if (r > maxRow) maxRow = r;
                if (c < minCol) minCol = c;
                if (c > maxCol) maxCol = c;
            });
            
            // Copy selection data (foreground and background)
            const width = maxCol - minCol + 1;
            const height = maxRow - minRow + 1;
            const fgData = [];
            const bgData = [];
            
            for (let r = minRow; r <= maxRow; r++) {
                const fgRow = [];
                const bgRow = [];
                for (let c = minCol; c <= maxCol; c++) {
                    const key = `${r},${c}`;
                    if (selectedCells.has(key)) {
                        fgRow.push(gridData[r] && gridData[r][c] ? gridData[r][c] : 0);
                        bgRow.push(backgroundData[r] && backgroundData[r][c] ? backgroundData[r][c] : 0);
                    } else {
                        fgRow.push(0);
                        bgRow.push(0);
                    }
                }
                fgData.push(fgRow);
                bgData.push(bgRow);
            }
            
            copiedSelection = {
                fg: fgData,
                bg: bgData,
                width: width,
                height: height
            };
            
            hideContextMenu();
        }

        function contextMenuPasteSelection() {
            if (!copiedSelection) return;
            
            // Determine paste position - use cursor position (where mouse is) or context menu position
            let startRow, startCol;
            if (cursorRow !== -1 && cursorCol !== -1) {
                // Paste at cursor position (where mouse is hovering)
                startRow = cursorRow;
                startCol = cursorCol;
            } else if (contextMenuRow !== -1 && contextMenuCol !== -1) {
                // Fallback to context menu position (where user right-clicked)
                startRow = contextMenuRow;
                startCol = contextMenuCol;
            } else if (selectedCells.size > 0) {
                // Fallback to top-left corner of current selection
                let minRow = Infinity, minCol = Infinity;
                selectedCells.forEach(key => {
                    const [r, c] = key.split(',').map(Number);
                    if (r < minRow) minRow = r;
                    if (c < minCol) minCol = c;
                });
                startRow = minRow;
                startCol = minCol;
            } else {
                return; // No valid paste position
            }
            
            saveUndo();
            
            for (let r = 0; r < copiedSelection.height; r++) {
                for (let c = 0; c < copiedSelection.width; c++) {
                    const destRow = startRow + r;
                    const destCol = startCol + c;
                    
                    // Bounds check
                    if (destRow >= 0 && destRow < rows && destCol >= 0 && destCol < cols) {
                        const fgCode = copiedSelection.fg[r][c];
                        const bgCode = copiedSelection.bg[r][c];
                        
                        if (bgCode) {
                            if (!backgroundData[destRow]) {
                                backgroundData[destRow] = [];
                            }
                            backgroundData[destRow][destCol] = bgCode;
                            gridData[destRow][destCol] = 0;
                        } else {
                            gridData[destRow][destCol] = fgCode;
                            if (backgroundData[destRow] && backgroundData[destRow][destCol]) {
                                backgroundData[destRow][destCol] = 0;
                            }
                        }
                        const placedCode = bgCode ? bgCode : fgCode;
                        updatePlatformMetadata(destRow, destCol, placedCode);
                        updateFirebarMetadata(destRow, destCol, placedCode);
                    }
                }
            }
            
            refreshGrid();
            hideContextMenu();
        }

        // Enhanced keyboard shortcuts (replaces basic ones)
        document.addEventListener('keydown', (e) => {
            const activeElement = document.activeElement;
            const isInputFocused = activeElement.tagName === 'INPUT' || activeElement.tagName === 'TEXTAREA';
            
            if (e.ctrlKey && e.key === 'z' && !isInputFocused) {
                e.preventDefault();
                undo();
            } else if (e.ctrlKey && e.key === 'y' && !isInputFocused) {
                e.preventDefault();
                redo();
            } else if (e.ctrlKey && e.key === 's' && !isInputFocused) {
                e.preventDefault();
                exportAll();
            } else if (e.ctrlKey && e.key === 'o' && !isInputFocused) {
                e.preventDefault();
                importAll();
            } else if (e.ctrlKey && e.key === 'x' && !isInputFocused) {
                // Ctrl+X to cut
                e.preventDefault();
                if (isSelectMode && selectedCells.size > 0) {
                    cutSelection();
                }
            } else if (e.ctrlKey && e.key === 'c' && !isInputFocused) {
                // Ctrl+C to copy
                e.preventDefault();
                if (isSelectMode && selectedCells.size > 0) {
                    // Copy selection
                    contextMenuCopySelection();
                } else if (contextMenuRow !== -1 && contextMenuCol !== -1) {
                    // Copy single cell
                    contextMenuCopyCell();
                }
            } else if (e.ctrlKey && e.key === 'v' && !isInputFocused) {
                // Ctrl+V to paste
                e.preventDefault();
                if (copiedSelection !== null) {
                    // Paste selection (works with or without selection)
                    contextMenuPasteSelection();
                } else if (contextMenuRow !== -1 && contextMenuCol !== -1 && copiedCell !== null) {
                    // Paste single cell
                    contextMenuPasteCell();
                }
            } else if (e.key === 's' && !e.ctrlKey && !e.altKey && !e.metaKey && !isInputFocused) {
                // S key to toggle select mode
                e.preventDefault();
                toggleSelectMode();
            } else if (e.key === 'f' && !e.ctrlKey && !e.altKey && !e.metaKey && !isInputFocused && isSelectMode && selectedCells.size > 0) {
                // F key to fill selection
                e.preventDefault();
                fillSelection();
            } else if ((e.key === 'Delete' || e.key === 'Backspace') && isSelectMode && selectedCells.size > 0 && !isInputFocused) {
                // Delete/Backspace to delete selection
                e.preventDefault();
                deleteSelection();
            } else if (e.key === 'Escape' && isSelectMode && !isInputFocused) {
                // Escape to clear selection
                e.preventDefault();
                clearSelection();
            } else if (e.key >= '0' && e.key <= '9' && !isInputFocused) {
                // Quick select by pressing number keys
                const num = parseInt(e.key);
                const tile = TILES.find(t => t.code === num);
                if (tile) selectTile(tile);
            } else if (e.ctrlKey && (e.key === '+' || e.key === '=') && !isInputFocused) {
                // Ctrl+Plus to zoom in
                e.preventDefault();
                zoomLevel = Math.min(200, zoomLevel + 10);
                const slider = document.getElementById('zoom-slider');
                if (slider) slider.value = zoomLevel;
                updateZoom();
            } else if (e.ctrlKey && e.key === '-' && !isInputFocused) {
                // Ctrl+Minus to zoom out
                e.preventDefault();
                zoomLevel = Math.max(25, zoomLevel - 10);
                const slider = document.getElementById('zoom-slider');
                if (slider) slider.value = zoomLevel;
                updateZoom();
            } else if (e.ctrlKey && e.key === '0' && !isInputFocused) {
                // Ctrl+0 to reset zoom
                e.preventDefault();
                resetZoom();
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (isSelectMode && selectionStart) {
                // Finalize selection on mouse up
                if (selectionEnd) {
                    updateSelectionFromRect();
                    updateSelectionDisplay();
                    updateSelectionButtons();
                }
            }
        });

        // Track mouse movement for selection
        document.addEventListener('mousemove', (e) => {
            if (isSelectMode && selectionStart && e.buttons === 1) {
                // Update selection while dragging in select mode
                const cell = e.target.closest('.cell');
                if (cell) {
                    selectionEnd = {
                        row: parseInt(cell.dataset.row),
                        col: parseInt(cell.dataset.col)
                    };
                    updateSelectionFromRect();
                    updateSelectionDisplay();
                }
            }
        });

        // Selection Mode Functions
        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            const btn = document.getElementById('selectModeBtn');
            if (isSelectMode) {
                btn.classList.add('select-mode-active');
                btn.textContent = '✅';
                // Clear selection when entering select mode
                clearSelection();
            } else {
                btn.classList.remove('select-mode-active');
                btn.textContent = '🔲';
                clearSelection();
            }
        }

        function updateSelectionFromRect() {
            if (!selectionStart || !selectionEnd) return;
            
            selectedCells.clear();
            const startRow = Math.min(selectionStart.row, selectionEnd.row);
            const endRow = Math.max(selectionStart.row, selectionEnd.row);
            const startCol = Math.min(selectionStart.col, selectionEnd.col);
            const endCol = Math.max(selectionStart.col, selectionEnd.col);
            
            for (let r = startRow; r <= endRow; r++) {
                for (let c = startCol; c <= endCol; c++) {
                    selectedCells.add(`${r},${c}`);
                }
            }
        }

        function updateSelectionDisplay() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                const key = `${r},${c}`;
                
                cell.classList.remove('selected', 'selecting');
                
                if (selectedCells.has(key)) {
                    cell.classList.add('selected');
                } else if (selectionStart && selectionEnd) {
                    const startRow = Math.min(selectionStart.row, selectionEnd.row);
                    const endRow = Math.max(selectionStart.row, selectionEnd.row);
                    const startCol = Math.min(selectionStart.col, selectionEnd.col);
                    const endCol = Math.max(selectionStart.col, selectionEnd.col);
                    
                    if (r >= startRow && r <= endRow && c >= startCol && c <= endCol) {
                        cell.classList.add('selecting');
                    }
                }
            });
        }

        function clearSelection() {
            selectedCells.clear();
            selectionStart = null;
            selectionEnd = null;
            updateSelectionDisplay();
            updateSelectionButtons();
        }

        function updateSelectionButtons() {
            const hasSelection = selectedCells.size > 0;
            document.getElementById('fillBtn').disabled = !hasSelection;
            document.getElementById('cutBtn').disabled = !hasSelection;
            document.getElementById('deleteBtn').disabled = !hasSelection;
        }

        function fillSelection() {
            if (selectedCells.size === 0) return;
            saveUndo();
            const code = selectedTile.code;
            const isBg = isBackgroundTile(code);
            
            selectedCells.forEach(key => {
                const [r, c] = key.split(',').map(Number);
                
                if (isBg) {
                    if (!backgroundData[r]) {
                        backgroundData[r] = [];
                    }
                    backgroundData[r][c] = code;
                    gridData[r][c] = 0;
                } else {
                    gridData[r][c] = code;
                    if (backgroundData[r] && backgroundData[r][c]) {
                        backgroundData[r][c] = 0;
                    }
                }
            });
            
            refreshGrid();
            clearSelection();
        }

        function cutSelection() {
            if (selectedCells.size === 0) return;
            
            // Copy the selection first
            contextMenuCopySelection();
            
            // Then delete it
            deleteSelection();
        }

        function deleteSelection() {
            if (selectedCells.size === 0) return;
            saveUndo();
            
            selectedCells.forEach(key => {
                const [r, c] = key.split(',').map(Number);
                gridData[r][c] = 0;
                if (backgroundData[r] && backgroundData[r][c]) {
                    backgroundData[r][c] = 0;
                }
                updatePlatformMetadata(r, c, 0);
                updateFirebarMetadata(r, c, 0);
            });
            
            refreshGrid();
            clearSelection();
        }


        // Level number change handler - refresh entire grid to update all tile colors
        const levelNumInput = document.getElementById('level-num');
        if (levelNumInput) {
            levelNumInput.addEventListener('change', () => {

                refreshGrid();

        // Zoom functionality
        function updateZoom() {
            const container = document.getElementById('grid-container');
            if (container) {
                const scale = zoomLevel / 100;
                container.style.transform = `scale(${scale})`;
            }
            const zoomValue = document.getElementById('zoom-value');
            if (zoomValue) {
                zoomValue.textContent = zoomLevel + '%';
            }
        }

        function resetZoom() {
            zoomLevel = 100;
            const slider = document.getElementById('zoom-slider');
            if (slider) {
                slider.value = zoomLevel;
            }
            updateZoom();
        }

        // Zoom slider event listener
        const zoomSlider = document.getElementById('zoom-slider');
        if (zoomSlider) {

            });

        // Mouse wheel zoom (Ctrl + Wheel)

        if (editorWrapper) {
            editorWrapper.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {

                    const slider = document.getElementById('zoom-slider');
                    if (slider) {
                        slider.value = zoomLevel;
                    }
                    updateZoom();
                }
            });

        const sizePanel = document.getElementById('sizePanel');

        if (sizePanel) {

                if (e.target.closest('.side-panel-header') && !sizePanel.classList.contains('minimized')) return;
                isSizePanelDragging = true;

                sizePanel.classList.add('dragging');

        let rafId = null;
        document.addEventListener('mousemove', (e) => {

                if (rafId) cancelAnimationFrame(rafId);

                    } else if (firebarsSectionDragging) {

                        const deltaY = e.clientY - firebarsDragStartY;

                            firebarsSectionDragOccurred = true;

                        firebarsSection.style.left = (firebarsInitialLeft + deltaX) + 'px';

                    } else if (platformsSectionDragging) {

                    firebarsSection.style.top = positions.firebarsSection.top + 'px';
                    firebarsSection.style.right = 'auto';
                }
                
                if (positions.platformsSection && platformsSection) {
                    platformsSection.style.position = 'fixed';
                    platformsSection.style.left = positions.platformsSection.left + 'px';
                    platformsSection.style.top = positions.platformsSection.top + 'px';
                    platformsSection.style.right = 'auto';
                }
                
            } catch (e) {
                console.error('Failed to load panel positions:', e);
            }
        }

        // Initialize
        createToolbar();
        
        // Try to load saved grid data, otherwise create new grid
        const gridLoaded = loadGridData();
        if (gridLoaded) {
            createGrid(true); // Preserve loaded data
            refreshGrid();
            updatePipesList();
        } else {
            createGrid();
            updatePipesList();
        }
        
        loadPanelPositions();
        loadPanelStates();
        loadSectionSizes();
        loadSectionStates();
        updateZoom();

        // Auto-update grid when rows/cols change
        const rowsInput = document.getElementById('rows');
        const colsInput = document.getElementById('cols');
        
        if (rowsInput) {
            rowsInput.addEventListener('change', () => {
                createGrid(true); // Preserve existing data when resizing
            });
        }
        
        if (colsInput) {
            colsInput.addEventListener('change', () => {
                createGrid(true); // Preserve existing data when resizing
            });
        }  
    </script>
</body>
</html>
